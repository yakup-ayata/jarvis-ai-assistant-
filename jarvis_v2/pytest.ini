[pytest]
# Pytest configuration for JARVIS V2

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test paths
testpaths = tests

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    -p no:warnings

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    asyncio: Async tests

# Async support
asyncio_mode = auto

# Coverage options (if pytest-cov is installed)
# --cov=jarvis_v2
# --cov-report=html
# --cov-report=term-missing
