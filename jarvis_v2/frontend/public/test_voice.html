<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS Voice Test</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #000;
            color: #0ff;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            color: #0ff;
            text-shadow: 0 0 10px #0ff;
        }
        .section {
            background: rgba(0, 255, 255, 0.1);
            border: 1px solid #0ff;
            padding: 20px;
            margin: 20px 0;
            border-radius: 5px;
        }
        button {
            background: #0ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            border-radius: 3px;
        }
        button:hover {
            background: #0aa;
        }
        #voiceList {
            max-height: 300px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #0ff;
        }
        .voice-item {
            padding: 5px;
            margin: 2px 0;
            cursor: pointer;
        }
        .voice-item:hover {
            background: rgba(0, 255, 255, 0.2);
        }
        .voice-item.selected {
            background: rgba(0, 255, 255, 0.3);
            border-left: 3px solid #0ff;
            padding-left: 7px;
        }
        .current-voice {
            color: #0f0;
            font-weight: bold;
        }
        .info {
            color: #888;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🎤 JARVIS Voice Test</h1>
    
    <div class="section">
        <h2>Current Voice Settings</h2>
        <div id="currentVoice" class="current-voice">Loading...</div>
        <div class="info">This is the voice JARVIS will use</div>
    </div>

    <div class="section">
        <h2>Test JARVIS Voice</h2>
        <button onclick="testJarvisVoice()">🔊 Test Current JARVIS Voice</button>
        <button onclick="testDaniel()">🎙️ Test Daniel Voice</button>
        <button onclick="testAlex()">🎙️ Test Alex Voice</button>
        <button onclick="testFred()">🎙️ Test Fred Voice</button>
    </div>

    <div class="section">
        <h2>Available Voices</h2>
        <div class="info">Click on a voice to test it</div>
        <div id="voiceList">Loading voices...</div>
    </div>

    <div class="section">
        <h2>Voice Configuration</h2>
        <div>
            <label>Pitch: <span id="pitchValue">0.75</span></label>
            <input type="range" id="pitch" min="0" max="2" step="0.05" value="0.75" 
                   oninput="document.getElementById('pitchValue').textContent = this.value">
        </div>
        <div>
            <label>Rate: <span id="rateValue">0.9</span></label>
            <input type="range" id="rate" min="0.1" max="2" step="0.1" value="0.9"
                   oninput="document.getElementById('rateValue').textContent = this.value">
        </div>
        <button onclick="testWithSettings()">🔊 Test with Custom Settings</button>
    </div>

    <script>
        let voices = [];
        let currentJarvisVoice = null;

        // Load voices
        function loadVoices() {
            voices = speechSynthesis.getVoices();
            
            if (voices.length === 0) {
                setTimeout(loadVoices, 100);
                return;
            }

            // Find JARVIS voice (Daniel priority)
            currentJarvisVoice = voices.find(v => v.name.includes('Daniel')) ||
                                voices.find(v => v.name.includes('Alex')) ||
                                voices.find(v => v.name.includes('Fred')) ||
                                voices.find(v => v.lang.startsWith('en'));

            // Display current voice
            if (currentJarvisVoice) {
                document.getElementById('currentVoice').innerHTML = `
                    ✅ ${currentJarvisVoice.name} (${currentJarvisVoice.lang})<br>
                    <span class="info">Local: ${currentJarvisVoice.localService ? 'Yes' : 'No'}</span>
                `;
            }

            // Display all voices
            const voiceList = document.getElementById('voiceList');
            voiceList.innerHTML = '';
            
            voices.forEach((voice, index) => {
                const div = document.createElement('div');
                div.className = 'voice-item';
                if (voice === currentJarvisVoice) {
                    div.className += ' selected';
                }
                div.innerHTML = `
                    <strong>${voice.name}</strong> (${voice.lang})
                    ${voice.localService ? '📍' : '☁️'}
                    ${voice === currentJarvisVoice ? ' ⭐ CURRENT' : ''}
                `;
                div.onclick = () => testVoice(voice);
                voiceList.appendChild(div);
            });
        }

        // Test JARVIS voice
        function testJarvisVoice() {
            if (!currentJarvisVoice) {
                alert('No JARVIS voice found!');
                return;
            }

            const utterance = new SpeechSynthesisUtterance(
                "At your service, sir. All systems operational."
            );
            utterance.voice = currentJarvisVoice;
            utterance.lang = 'en-GB';
            utterance.rate = 0.9;
            utterance.pitch = 0.75;
            utterance.volume = 1.0;

            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        // Test specific voices
        function testDaniel() {
            const daniel = voices.find(v => v.name.includes('Daniel'));
            if (daniel) {
                testVoice(daniel);
            } else {
                alert('Daniel voice not found! Please install it from System Settings.');
            }
        }

        function testAlex() {
            const alex = voices.find(v => v.name.includes('Alex'));
            if (alex) {
                testVoice(alex);
            } else {
                alert('Alex voice not found!');
            }
        }

        function testFred() {
            const fred = voices.find(v => v.name.includes('Fred'));
            if (fred) {
                testVoice(fred);
            } else {
                alert('Fred voice not found!');
            }
        }

        // Test any voice
        function testVoice(voice) {
            const utterance = new SpeechSynthesisUtterance(
                "Hello, I am " + voice.name + ". At your service, sir."
            );
            utterance.voice = voice;
            utterance.rate = 0.9;
            utterance.pitch = 0.75;

            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        // Test with custom settings
        function testWithSettings() {
            if (!currentJarvisVoice) {
                alert('No JARVIS voice found!');
                return;
            }

            const pitch = parseFloat(document.getElementById('pitch').value);
            const rate = parseFloat(document.getElementById('rate').value);

            const utterance = new SpeechSynthesisUtterance(
                "Testing custom settings. Pitch is " + pitch + " and rate is " + rate + "."
            );
            utterance.voice = currentJarvisVoice;
            utterance.pitch = pitch;
            utterance.rate = rate;

            speechSynthesis.cancel();
            speechSynthesis.speak(utterance);
        }

        // Load voices on page load
        if (speechSynthesis.onvoiceschanged !== undefined) {
            speechSynthesis.onvoiceschanged = loadVoices;
        }
        loadVoices();
    </script>
</body>
</html>
